openapi: 3.0.3
info:
  title: MES Data Upload API Contract
  description: |
    Inspection data upload endpoint for Cimforce MES Trace Management System.
    Based on API specification document CIMFORCE-WPT-20240902.

    This contract enforces the three-tier data structure (paramData, benchmarks, otherData)
    per Constitution Principle IV (Structured Data Contracts).

    Success Criteria (SC-002): Upload completes in <10 seconds for 10-20 defects
  version: 1.0.0
  contact:
    name: MES Integration Team

servers:
  - url: http://{ip}:{port}/CimforceTraceMgrDev
    description: MES API Server
    variables:
      ip:
        default: localhost
      port:
        default: '8080'

paths:
  /api/v1/MesTrace/TraceData/AddData3:
    post:
      summary: Upload Inspection Data
      description: |
        Uploads complete inspection trace data to MES system.

        Authentication: Requires accessToken header from login response.

        Data Structure Requirements (FR-009):
        - paramData: Summary metrics (Result, CheckQty, DefectQty, OkQty)
        - benchmarks: Detailed defects (up to 99 categories per FR-018)
        - otherData: Auxiliary info (LayersType, SourceType, CheckTime)

        Equipment Types Supported (FR-013): AOI, AVI, VRS, ET, blind hole detection
      operationId: uploadInspectionData
      tags:
        - Data Upload
      security:
        - bearerAuth: []
      parameters:
        - name: accessToken
          in: header
          required: true
          description: Authentication token from login response
          schema:
            type: string
            example: "autoprtaed02b44469a0e81a63dec431"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionDataUploadRequest'
            examples:
              singleBoardPass:
                summary: Single board PASS inspection
                value:
                  isVerifyLot: false
                  data:
                    - rowNo: 1
                      procName: "ET"
                      devName: "W4-MXDCJ-001"
                      userName: "215123"
                      workClass: "A"
                      traceCode: "09O12380010001"
                      lotNo: "02029156-00800-N"
                      partNumber: "4FD890011A01"
                      remark: ""
                      paramData:
                        - code: "Result"
                          name: "单板检测结果"
                          value: "PASS"
                          unit: ""
                          desc: "单板检测结果"
                        - code: "CheckQty"
                          name: "检测数量"
                          value: "190"
                          unit: "个"
                          desc: "检测数量"
                        - code: "DefectQty"
                          name: "NG 数量"
                          value: "5"
                          unit: "个"
                          desc: "NG 数量"
                        - code: "OkQty"
                          name: "OK 数量"
                          value: "185"
                          unit: "个"
                          desc: "OK 数量"
                      benchmarks:
                        - code: "Defect_Qty_01"
                          name: "开路数量"
                          value: "3"
                          unit: ""
                          desc: "开路数量"
                        - code: "Defect_Qty_02"
                          name: "短路数量"
                          value: "2"
                          unit: ""
                          desc: "短路数量"
                        - code: "Defect_Pos_01"
                          name: "开路-坐标及图片路径"
                          value: "X=325.0;Y=229.0"
                          unit: ""
                          desc: "170.18.1.101\\D41029\\0"
                        - code: "Check_Param_01"
                          name: "Open Voltage"
                          value: "100"
                          unit: "V"
                          desc: "Open Voltage"
                      otherData:
                        - code: "LayersType"
                          name: "面次"
                          value: "TOP"
                          unit: ""
                          desc: "面次"
                        - code: "SourceType"
                          name: "数据分类"
                          value: "1"
                          unit: ""
                          desc: "1=机测;2=复检"
                        - code: "CheckTime"
                          name: "测试时间"
                          value: "2024-08-29T08:30:00"
                          unit: ""
                          desc: "测试时间"
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSuccessResponse'
              examples:
                success:
                  value:
                    success: true
                    data: null
                    msg: "上传成功"
                    code: "200"
        '400':
          description: Validation error (missing required fields, invalid data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  summary: Missing required field
                  value:
                    success: false
                    data: null
                    msg: "缺少必填字段: traceCode 和 lotNo 至少需要一个"
                    code: "400"
        '401':
          description: Authentication error (invalid/expired token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  summary: Invalid authentication token
                  value:
                    success: false
                    data: null
                    msg: "Token 无效或已过期,请重新登录"
                    code: "401"
        '404':
          description: Work order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                workOrderNotFound:
                  summary: Work order does not exist
                  value:
                    success: false
                    data: null
                    msg: "工单[202401-01-000]不存在"
                    code: "-1"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    InspectionDataUploadRequest:
      type: object
      required:
        - isVerifyLot
        - data
      properties:
        isVerifyLot:
          type: boolean
          description: Whether MES should perform mixed-batch validation after receiving data
          example: false
        data:
          type: array
          description: Inspection result data list (at least one record required)
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/InspectionRecord'
      additionalProperties: false

    InspectionRecord:
      type: object
      required:
        - rowNo
        - procName
        - devName
        - userName
        - workClass
        - paramData
        - benchmarks
        - otherData
      properties:
        rowNo:
          type: integer
          description: Data row number, starting from 1 (FR-007)
          minimum: 1
          example: 1
        procName:
          type: string
          description: Process/station name or code (FR-007)
          minLength: 1
          maxLength: 50
          example: "ET"
        devName:
          type: string
          description: Equipment identifier (FR-007)
          minLength: 1
          maxLength: 50
          example: "W4-MXDCJ-001"
        userName:
          type: string
          description: Operator ID or name (FR-007)
          minLength: 1
          maxLength: 50
          example: "215123"
        workClass:
          type: string
          description: Operator shift/class (FR-007)
          minLength: 1
          maxLength: 10
          example: "A"
        traceCode:
          type: string
          nullable: true
          description: Board QR code (required if lotNo not provided, per FR-008)
          maxLength: 100
          example: "09O12380010001"
        lotNo:
          type: string
          nullable: true
          description: Lot/batch number (required if traceCode not provided, per FR-008)
          maxLength: 100
          example: "02029156-00800-N"
        partNumber:
          type: string
          nullable: true
          description: Product model number
          maxLength: 50
          example: "4FD890011A01"
        remark:
          type: string
          nullable: true
          description: Additional notes (e.g., board sequence number)
          maxLength: 500
          example: ""
        paramData:
          type: array
          description: Summary-level data (Result, CheckQty, DefectQty, OkQty) per FR-009
          minItems: 1
          maxItems: 99
          items:
            $ref: '#/components/schemas/ParameterData'
        benchmarks:
          type: array
          description: Detailed inspection data (defect counts, positions, test parameters) per FR-009
          maxItems: 99
          items:
            $ref: '#/components/schemas/BenchmarkData'
        otherData:
          type: array
          description: Auxiliary information (LayersType, SourceType, CheckTime) per FR-009
          maxItems: 99
          items:
            $ref: '#/components/schemas/OtherData'

    ParameterData:
      type: object
      required:
        - code
        - name
        - value
      properties:
        code:
          type: string
          description: Parameter code (Result, CheckQty, DefectQty, OkQty per FR-010)
          minLength: 1
          maxLength: 50
          example: "Result"
        name:
          type: string
          description: Parameter display name
          minLength: 1
          maxLength: 100
          example: "单板检测结果"
        value:
          type: string
          description: Parameter value (string representation)
          example: "PASS"
        unit:
          type: string
          nullable: true
          description: Unit of measurement (required for numeric values per FR-011)
          maxLength: 20
          example: "个"
        desc:
          type: string
          nullable: true
          description: Parameter description
          maxLength: 200
          example: "单板检测结果"

    BenchmarkData:
      type: object
      required:
        - code
        - name
        - value
      properties:
        code:
          type: string
          description: Benchmark code (Defect_Qty_01-99, Defect_Pos_01-99, Check_Param_01-99 per FR-010)
          pattern: '^(Defect_(Qty|Pos)_\d{2}|Check_Param_\d{2})$'
          example: "Defect_Qty_01"
        name:
          type: string
          description: Benchmark display name
          minLength: 1
          maxLength: 100
          example: "开路数量"
        value:
          type: string
          description: Benchmark value (count, coordinates "X={float};Y={float}", or parameter per FR-017)
          example: "5"
        unit:
          type: string
          nullable: true
          description: Unit of measurement (FR-011)
          maxLength: 20
          example: ""
        desc:
          type: string
          nullable: true
          description: Additional details (e.g., image path for Defect_Pos_NN per FR-019)
          maxLength: 500
          example: "170.18.1.101\\D41029\\0"

    OtherData:
      type: object
      required:
        - code
        - name
        - value
      properties:
        code:
          type: string
          description: Data code (LayersType, SourceType, CheckTime)
          minLength: 1
          maxLength: 50
          example: "LayersType"
        name:
          type: string
          description: Data display name
          minLength: 1
          maxLength: 100
          example: "面次"
        value:
          type: string
          description: Data value (TOP/BOT for LayersType, 1/2 for SourceType, ISO timestamp for CheckTime per FR-012, FR-015)
          example: "TOP"
        unit:
          type: string
          nullable: true
          description: Unit (typically empty for categorical data)
          maxLength: 20
          example: ""
        desc:
          type: string
          nullable: true
          description: Additional description
          maxLength: 200
          example: "面次"

    UploadSuccessResponse:
      type: object
      required:
        - success
        - data
        - msg
        - code
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          nullable: true
          description: Response data (typically null for upload)
          example: null
        msg:
          type: string
          example: "上传成功"
        code:
          type: string
          enum: ["200"]

    ErrorResponse:
      type: object
      required:
        - success
        - data
        - msg
        - code
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          type: object
          nullable: true
          example: null
        msg:
          type: string
          description: Error message
          example: "工单[202401-01-000]不存在"
        code:
          type: string
          description: Error code (non-200 indicates failure)
          example: "-1"

  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: accessToken
      description: Authentication token from login response
